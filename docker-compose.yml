# AIOW 本地开发环境 - PostgreSQL + Redis
# 用法：docker compose up -d
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiow
      POSTGRES_PASSWORD: aiow
      POSTGRES_DB: aiow
    ports:
      - "5432:5432"
    volumes:
      - aiow_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aiow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  aiow_pg_data:
  aiow_redis_data:
