# AIOW 生产部署栈
# 用法：
#   1. 复制 .env.production.example 为 .env.production 并填写真实值
#   2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   3. 首次启动后跑迁移：docker compose -f docker-compose.prod.yml exec api alembic upgrade head
#   4. 运行上线检查：docker compose -f docker-compose.prod.yml exec api python scripts/launch_checklist.py

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiow-pg-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - aiow_pg_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 不暴露端口给主机，仅内部网络
    networks: [aiow-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: aiow-redis-prod
    restart: always
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - aiow_redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aiow-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiow-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-1000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    ports:
      - "127.0.0.1:8000:8000"  # 仅 Nginx/反向代理可达
    networks: [aiow-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  nginx:
    image: nginx:1.27-alpine
    container_name: aiow-nginx-prod
    restart: always
    depends_on: [api]
    ports:
      - "80:80"
      # - "443:443"  # 启用 HTTPS 时挂载证书
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [aiow-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  aiow_pg_data_prod:
  aiow_redis_data_prod:

networks:
  aiow-net:
    driver: bridge
