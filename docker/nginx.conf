# AIOW Nginx 反向代理配置
# 用法：放在容器或主机 nginx，include 到 server block

upstream aiow_backend {
    # 多实例时列出所有 backend
    # server backend1:8000 max_fails=3 fail_timeout=30s;
    # server backend2:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 限流：每个 IP 10 req/s 突发 20
limit_req_zone $binary_remote_addr zone=aiow_api:10m rate=10r/s;
# 连接数限制
limit_conn_zone $binary_remote_addr zone=aiow_conn:10m;

server {
    listen 80;
    server_name _;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体大小限制（图片上传等）
    client_max_body_size 10m;

    # 限流
    limit_req zone=aiow_api burst=20 nodelay;
    limit_conn aiow_conn 20;

    # 健康检查（不走限流，便于 LB 探测）
    location = /health {
        proxy_pass http://aiow_backend;
        access_log off;
    }
    location = /ready {
        proxy_pass http://aiow_backend;
        access_log off;
    }
    location = /metrics {
        # 仅允许内部网络访问（Prometheus 抓取）
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;
        proxy_pass http://aiow_backend;
        access_log off;
    }

    # API 路由
    location /api/ {
        proxy_pass http://aiow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # 生产环境关闭 docs
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # 根路径
    location / {
        return 200 'AIOW API\n';
        add_header Content-Type text/plain;
    }
}
